<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>그럴듯한 답변과 합격은 다르다</title><desc>모델 선택 전에, 끝났다는 기준부터 정하기</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#18181b}.small{font-size:22px;fill:#52525b}.label{font-size:28px;font-weight:700}.white{fill:white}</style><rect width="1200" height="630" fill="#fffdf7"/><rect x="0" width="14" height="630" fill="#b32265"/><text x="60" y="65" class="small">KYJIN / LEARNING NOTES</text><text x="60" y="135" font-size="44" font-weight="800">그럴듯한 답변과 합격은 다르다</text><text x="60" y="183" class="small">모델 선택 전에, 끝났다는 기준부터 정하기</text><rect x="60" y="280" width="340" height="180" rx="16" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/><text x="84" y="335" class="label">01 규칙 확인</text><text x="84" y="393" class="small">무엇이 정답인가?</text><path d="M404 370 h18 l-6 -6 m6 6 l-6 6" fill="none" stroke="#b32265" stroke-width="3"/><rect x="430" y="280" width="340" height="180" rx="16" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/><text x="454" y="335" class="label">02 답변 생성</text><text x="454" y="393" class="small">AI가 일을 수행한다</text><path d="M774 370 h18 l-6 -6 m6 6 l-6 6" fill="none" stroke="#b32265" stroke-width="3"/><rect x="800" y="280" width="340" height="180" rx="16" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/><text x="824" y="335" class="label">03 별도 판정</text><text x="824" y="393" class="small">조건을 충족했는가?</text><text x="60" y="582" class="small">자체 정리한 개념도 · 실제 환불/API 실행 결과가 아님</text></svg>