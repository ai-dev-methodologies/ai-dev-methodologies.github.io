<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>전부 기억하기보다, 이어갈 근거를</title><desc>다음 작업에 필요한 결정과 결과만 전달하기</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;fill:#18181b}.small{font-size:22px;fill:#52525b}.label{font-size:28px;font-weight:700}.white{fill:white}</style><rect width="1200" height="630" fill="#fffdf7"/><rect x="0" width="14" height="630" fill="#b32265"/><text x="60" y="65" class="small">KYJIN / LEARNING NOTES</text><text x="60" y="135" font-size="44" font-weight="800">전부 기억하기보다, 이어갈 근거를</text><text x="60" y="183" class="small">다음 작업에 필요한 결정과 결과만 전달하기</text><rect x="60" y="280" width="340" height="180" rx="16" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/><text x="84" y="335" class="label">01 기록</text><text x="84" y="393" class="small">목표·결정·실패</text><path d="M404 370 h18 l-6 -6 m6 6 l-6 6" fill="none" stroke="#b32265" stroke-width="3"/><rect x="430" y="280" width="340" height="180" rx="16" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/><text x="454" y="335" class="label">02 전달</text><text x="454" y="393" class="small">필요한 배경 선별</text><path d="M774 370 h18 l-6 -6 m6 6 l-6 6" fill="none" stroke="#b32265" stroke-width="3"/><rect x="800" y="280" width="340" height="180" rx="16" fill="#ffffff" stroke="#ddd6c8" stroke-width="2"/><text x="824" y="335" class="label">03 확인</text><text x="824" y="393" class="small">결과 내용 검토</text><text x="60" y="582" class="small">Ilyas 시리즈를 읽고 정리한 인수인계 원리 · 자체 제작</text></svg>